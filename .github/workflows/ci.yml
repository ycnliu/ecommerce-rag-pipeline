name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.9'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest pytest-cov pytest-asyncio httpx flake8 black isort mypy

    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --max-complexity=10 --max-line-length=88 --output-file=flake8-report.txt --tee

    - name: Check code formatting with black
      run: |
        black --check src/ tests/ scripts/ space/

    - name: Check import sorting with isort
      run: |
        isort --check-only src/ tests/

    - name: Type check (informational)
      run: |
        mypy src/ --ignore-missing-imports || true

    - name: Test with pytest
      env:
        LLM_API_TOKEN: test_token
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing --ignore=tests/manual/

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: lint-report-${{ matrix.python-version }}
        path: flake8-report.txt

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety pip-audit

    - name: Security check with bandit
      run: |
        # Generate full report (all severities)
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -f txt || true
        # Fail only on high severity issues
        HIGH_ISSUES=$(bandit -r src/ -f json --severity-level high 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('results',[])))" 2>/dev/null || echo "0")
        echo "High severity issues found: $HIGH_ISSUES"
        if [ "$HIGH_ISSUES" != "0" ]; then
          echo "Failing due to high severity security issues"
          bandit -r src/ --severity-level high
          exit 1
        fi

    - name: Dependency audit with pip-audit
      run: |
        pip-audit --desc --fix-version || echo "Some vulnerabilities found, see output above"

    - name: Check dependencies with safety
      run: |
        safety check --json --output safety-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v6
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build-docker:
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/ecommerce-rag-pipeline
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # Placeholder jobs for future infrastructure deployments
  # Real deployments happen via deploy-spaces.yml (HuggingFace Spaces)
  deploy-staging-placeholder:
    name: Deploy Staging (placeholder)
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/develop'

    steps:
    - name: Staging deployment placeholder
      run: |
        echo "Staging deployment placeholder"
        echo "Configure kubectl/helm commands when infrastructure is ready"

  deploy-production-placeholder:
    name: Deploy Production (placeholder)
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Production deployment placeholder
      run: |
        echo "Production deployment placeholder"
        echo "Configure kubectl/helm commands when infrastructure is ready"
        echo "Note: HuggingFace Spaces deployment is handled by deploy-spaces.yml"