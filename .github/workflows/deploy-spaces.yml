name: Deploy to HuggingFace Spaces

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hf-spaces-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.9'
  HF_USERNAME: YCHL
  HF_SPACE_PROD: amazon-chatbot-rag-pipeline
  HF_SPACE_PREVIEW: amazon-chatbot-rag-preview

jobs:
  build-artifacts:
    name: Build Demo Artifacts
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy pydantic

    - name: Build demo dataset
      run: |
        python scripts/prepare_demo_data.py \
          --input data/amazon_com_ecommerce.csv \
          --output space/demo_products.csv \
          --limit 100

    - name: Generate metadata manifest
      run: |
        python scripts/generate_manifest.py \
          --output space/manifest.json \
          --version ${{ github.sha }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: demo-artifacts
        path: |
          space/demo_products.csv
          space/manifest.json
        retention-days: 30

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest pytest-cov flake8 black isort mypy bandit pip-audit

    - name: Run tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term --ignore=tests/manual/

    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --max-complexity=10 --max-line-length=88

    - name: Check code formatting
      run: |
        black --check src/ tests/ scripts/ space/

    - name: Type check (informational)
      run: |
        mypy src/ --ignore-missing-imports || true

    - name: Security scan with bandit
      run: |
        # Generate full report (all severities)
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -f txt || true
        # Fail only on high severity issues
        HIGH_ISSUES=$(bandit -r src/ -f json --severity-level high 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(len(d.get('results',[])))" 2>/dev/null || echo "0")
        echo "High severity issues found: $HIGH_ISSUES"
        if [ "$HIGH_ISSUES" != "0" ]; then
          echo "Failing due to high severity security issues"
          bandit -r src/ --severity-level high
          exit 1
        fi
        echo "Security scan complete. Full report in bandit-report.json"

    - name: Dependency audit
      run: |
        # Report vulnerabilities but don't fail (many ML deps have known issues)
        pip-audit --desc --fix-version || echo "Note: Some dependencies have known vulnerabilities. Review pip-audit output above."

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: bandit-report.json

  deploy-preview:
    name: Deploy Preview (PR)
    runs-on: ubuntu-latest
    needs: [build-artifacts, quality-gates]
    if: github.event_name == 'pull_request'

    steps:
    - uses: actions/checkout@v6

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: demo-artifacts
        path: space/

    - name: Install HuggingFace CLI
      run: |
        pip install huggingface_hub

    - name: Verify HF Token
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        if [ -z "$HF_TOKEN" ]; then
          echo "ERROR: HF_TOKEN secret is not set"
          exit 1
        fi
        echo "HF_TOKEN is configured"

    - name: Deploy to Preview Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python scripts/deploy_to_space.py \
          --space-id ${{ env.HF_USERNAME }}/${{ env.HF_SPACE_PREVIEW }} \
          --source-dir space/ \
          --commit-message "Preview: PR #${{ github.event.pull_request.number }}"

    - name: Smoke test preview
      continue-on-error: true
      run: |
        sleep 90  # Wait for Space to build and start
        # Verify deployment by checking for commit SHA in response
        if curl -fsSL "https://${{ env.HF_USERNAME }}-${{ env.HF_SPACE_PREVIEW }}.hf.space" | grep -q "${GITHUB_SHA:0:7}"; then
          echo "Deployment verified: commit ${GITHUB_SHA:0:7} found"
        else
          echo "Warning: commit SHA not found in response (Space may still be building)"
        fi

    - name: Comment on PR
      uses: actions/github-script@v7
      with:
        script: |
          const marker = '<!-- hf-preview-comment -->';
          const body = `${marker}\n## Preview Deployed\n\n` +
                `Preview URL: https://huggingface.co/spaces/${{ env.HF_USERNAME }}/${{ env.HF_SPACE_PREVIEW }}\n\n` +
                `Built from commit: \`${context.sha.substring(0, 7)}\`\n` +
                `Quality gates: Passed`;

          // Find existing comment
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
          }

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build-artifacts, quality-gates]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v6

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: demo-artifacts
        path: space/

    - name: Install HuggingFace CLI
      run: |
        pip install huggingface_hub

    - name: Verify HF Token
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        if [ -z "$HF_TOKEN" ]; then
          echo "ERROR: HF_TOKEN secret is not set"
          exit 1
        fi
        echo "HF_TOKEN is configured (length: ${#HF_TOKEN})"

    - name: Deploy to Production Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python scripts/deploy_to_space.py \
          --space-id ${{ env.HF_USERNAME }}/${{ env.HF_SPACE_PROD }} \
          --source-dir space/ \
          --commit-message "Deploy: ${GITHUB_SHA:0:7}"

    - name: Smoke test production
      continue-on-error: true
      run: |
        sleep 90  # Wait for Space to build and start
        # Verify deployment by checking for commit SHA in response
        if curl -fsSL "https://${{ env.HF_USERNAME }}-${{ env.HF_SPACE_PROD }}.hf.space" | grep -q "${GITHUB_SHA:0:7}"; then
          echo "Deployment verified: commit ${GITHUB_SHA:0:7} found in production"
        else
          echo "Warning: commit SHA not found in response (Space may still be building)"
        fi

    - name: Notify on success
      if: success()
      run: |
        echo "Production deployment successful"
        echo "URL: https://huggingface.co/spaces/${{ env.HF_USERNAME }}/${{ env.HF_SPACE_PROD }}"

    - name: Rollback on failure
      if: failure()
      run: |
        echo "Deployment failed - manual intervention required"
        exit 1
